<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none';">
<title>ActionClip</title>
<link rel="stylesheet" href="widget.css">
<script src="../lib/i18n-renderer.js"></script>
<script src="../lib/window-behavior.js"></script>
</head>
<body>
  <!-- lang/dir are set at runtime from Settings ▸ language (English default,
       per STANDARDS.md §4) by i18n.applyI18n in widget.js. -->
  <div class="widget" id="widget" role="region" aria-label="ActionClip">
    <button class="close-btn" id="closeBtn" data-i18n-title="widget.hide" title="Hide widget" aria-label="Hide widget"><span aria-hidden="true">✕</span></button>

    <div class="header">
      <img class="logo" src="../../assets/logo.png" alt="" aria-hidden="true">
      <span class="app-name">ActionClip</span>
    </div>

    <!-- Live region: a screen reader announces pause/resume no matter which
         surface (tray, widget, Settings) changed it. Status is never color-only:
         the dot is decorative, the text says it in words. -->
    <div class="status-row" role="status" aria-live="polite">
      <span class="status-dot" id="statusDot" aria-hidden="true"></span>
      <span class="status-text" id="statusText" data-i18n="widget.loading">Loading…</span>
    </div>

    <div class="recent-row hidden" id="recentRow">
      <span class="recent-icon" id="recentIcon" aria-hidden="true"></span>
      <span class="recent-text" id="recentText"></span>
    </div>

    <div class="actions-row">
      <button class="widget-btn primary" id="toggleBtn"><span class="btn-icon" id="toggleIcon" aria-hidden="true">⏸</span><span id="toggleLabel" data-i18n="widget.pause">Pause</span></button>
      <button class="widget-btn" id="historyBtn"><span class="btn-icon" aria-hidden="true">🕘</span><span data-i18n="widget.history">History</span></button>
    </div>
  </div>

  <script src="widget.js"></script>
</body>
</html>
